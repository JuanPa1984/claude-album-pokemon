schema_version: "1.1"
name: api-auth-me-scenarios
expected_outcome: |
  A new or extended .feature file under apis/api/test/features covers /auth/me with a valid token (200 and the user's username), no token (401) and an invalid token (401); step definitions reuse existing phrases such as 'the response status is {int}' and 'I am logged in as {string}' instead of duplicating them; pnpm test:bdd in apis/api passes.
